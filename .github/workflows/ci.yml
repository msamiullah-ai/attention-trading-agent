name: CI

# The pytest suite was uncollectable on main for two commits without anyone
# noticing (a strategy was cut, its tests weren't). This runs it on every push
# so that can't happen quietly again.

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: Trading-main/alpaca_bot

jobs:
  backend:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        # No network and no Alpaca keys needed — the suite is fully offline.
        run: python -m pytest -q

  frontend:
    name: tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Trading-main/alpaca_bot/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Trading-main/alpaca_bot/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # vite build transpiles without checking types, so tsc runs separately.
        run: npm run typecheck

      - name: Build
        run: npm run build
