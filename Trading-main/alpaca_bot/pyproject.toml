[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "alpaca-bot"
version = "0.1.0"
description = "Automated trading bot for Alpaca with expectancy/Kelly risk framework"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33.0,<1.0.0",
    "pandas>=2.2.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "PyYAML>=6.0.1,<7.0.0",
]

[project.optional-dependencies]
backtest = ["matplotlib>=3.8.0,<4.0.0"]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.setuptools.packages.find]
include = ["trading_bot*"]
