  # Crypto lives in config_crypto.yaml as its own bot process (running
  # crypto_momentum, the strategy actually built/tested for it) -- NOT here,
  # so the two bot processes never both watch/trade the same symbol.

# Which strategy to run. Must match a key in signals.py REGISTRY:
#   ema_rsi | vwap_mean_reversion | bollinger_squeeze | crypto_momentum
strategy: opening_range_breakout

# Parameters passed to the strategy constructor. See signals.py for each
# strategy's full parameter list and defaults.
strategy_params: {}

# Bar timeframe pulled from Alpaca: 1Min, 5Min, 15Min, 1Hour, 1Day.
timeframe: 1Min
# Bars of history fetched each cycle. Must exceed the strategy's min_bars
# (bollinger_squeeze needs the most: bb_period + squeeze_lookback + 1 = 41).
lookback_bars: 250

data:
  # iex = free plan. sip = full consolidated tape, requires a paid Alpaca plan.
  feed: iex

risk:
  # Position sizing: Kelly-derived fraction of equity, scaled by this
  # multiplier (0.25 = quarter, 0.5 = half, 1.0 = full Kelly).
  kelly_multiplier: 0.5
  # Hard ceiling on any single trade's size, regardless of what Kelly says.
  max_position_pct: 0.05
  # Hard cap on number of open positions.
  max_open_positions: 3
  # Refuse new entries once the day's loss reaches this fraction of equity.
  max_daily_loss_pct: 0.03
  # Trades required before trusting a live win-rate/R-ratio for Kelly sizing.
  min_trades_for_kelly: 20
  # Flat position size (fraction of equity) used before that history exists.
  fallback_position_pct: 0.02
  # Window of recent trades checked for the negative-expectancy pause.
  expectancy_window: 20
  # Size equities fractionally when a whole share costs more than the risk
  # budget allows, so the same percentages hold at any account size. Without
  # it a small account cannot open most positions and simply never trades.
  # Fractional positions cannot carry a broker-side bracket, so they are
  # protected by the in-process stop/target watch instead.
  allow_fractional_equity: true
  # Measured correlation at/above this blocks opening a second, near-duplicate
  # bet. Lower = stricter (fewer simultaneous positions in related names).
  correlation_threshold: 0.75
  # Extra pairs treated as correlated regardless of what the trailing window
  # measures, merged with the built-in seed list in correlation.py. Six built-in
  # pairs cannot cover a 1000-symbol universe; add the ones that matter to yours.
  correlated_pairs: []
  #  - ["KO", "PEP"]
  #  - ["V", "MA"]
  #  - ["DAL", "UAL"]

execution:
  # How orders reach Alpaca.
  #   rest = alpaca-py TradingClient (direct HTTPS)
  #   mcp  = Alpaca's MCP server, launched as a subprocess via uvx
  # MCPBroker is a drop-in for Broker, so this only swaps the transport. It also
  # unlocks news and corporate-action retrieval for the agent layer, which the
  # REST client has no endpoint for -- with transport: rest the LLM reviewer
  # sees the trade and nothing else.
  transport: mcp
  # Who gets a position slot when more symbols qualify than max_open_positions
  # allows.
  #   none = the first to qualify while scanning `symbols` top to bottom. That
  #          makes a symbol's position in this file a hidden input: measured on
  #          a live run the three slots went to indices 649, 871 and 892, and
  #          every symbol after 892 was refused whatever it was showing.
  #   drr  = Deficit Round Robin (Shreedhar & Varghese, SIGCOMM 1995). Ranks on
  #          signal agreement, and a symbol repeatedly passed over accrues
  #          credit until it wins. Merit first, no starvation.
  scheduler: drr
  # How capital is split between the equity and the options side.
  #   none    = each sizes against full equity independently. Run both
  #             processes and together they can commit past 100%.
  #   dynamic = allocation.decide() gives each a ceiling, from the regime,
  #             trend strength, volatility and each side's recent form.
  #             It can only ever give a side LESS than it has today.
  allocator: dynamic
  order_type: market      # market | limit
  time_in_force: day      # day | gtc
  # Limit price offset from last quote, only used when order_type: limit.
  limit_slippage_pct: 0.001
  # Skip trading when the market is closed.
  require_market_open: true

engine:
  # Seconds between strategy evaluations when run with --loop. 180s here
  # because fetching 1000 symbols in one batched request measured ~116s in
  # practice -- 60s would mean each cycle starts before the last one's fetch
  # even finished. Measured real fetch time, not a guess; re-check this if
  # the symbol count changes materially.
  poll_interval_seconds: 180
